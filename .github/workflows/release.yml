name: Release

# Releases are driven by the version in gradle.properties, not by this trigger alone: an ordinary
# merge to main does nothing. A release happens only when VERSION_NAME has had its -SNAPSHOT
# suffix removed, which makes the version bump PR the point where a human decides to release.
on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write   # needed to create the tag and GitHub Release

jobs:
  check:
    name: Decide whether to release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      should_release: ${{ steps.decide.outputs.should_release }}
      version: ${{ steps.decide.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0   # tags are needed to detect an already-released version

      - name: Decide
        id: decide
        run: |
          VERSION=$(grep '^VERSION_NAME=' gradle.properties | cut -d= -f2)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          if [ -z "$VERSION" ]; then
            echo "::error::VERSION_NAME is missing from gradle.properties"
            exit 1
          fi

          if [ "${VERSION%-SNAPSHOT}" != "$VERSION" ]; then
            echo "::notice::$VERSION is a snapshot - nothing to release."
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if git rev-parse "v$VERSION" >/dev/null 2>&1; then
            echo "::notice::v$VERSION is already tagged - already released."
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "::notice::Releasing $VERSION"
          echo "should_release=true" >> "$GITHUB_OUTPUT"

  release:
    name: Publish to Maven Central
    needs: check
    if: needs.check.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      # Last gate before an irreversible publish.
      - name: Run unit tests
        run: ./gradlew test --stacktrace

      # Gradle reads ORG_GRADLE_PROJECT_-prefixed environment variables as Gradle properties, so
      # the publishing convention plugin needs no CI-specific configuration.
      - name: Publish
        run: ./gradlew publish -PVERSION_NAME=${{ needs.check.outputs.version }} --stacktrace
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_IN_MEMORY_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyId: ${{ secrets.SIGNING_IN_MEMORY_KEY_ID }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_IN_MEMORY_KEY_PASSWORD }}

      # Created only after a successful publish, so a failed run leaves no dangling tag to clean up.
      #
      # Notes come from GitHub's own generator (which applies the label grouping in
      # .github/release.yml), then have the "[Type] " PR title prefix stripped - the category
      # headings already say Features/Bug Fixes/etc., so the prefix is redundant there.
      - name: Create tag and GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${{ needs.check.outputs.version }}"

          NOTES=$(gh api "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
            -f tag_name="$TAG" \
            -f target_commitish="${GITHUB_SHA}" \
            --jq .body | sed -E 's/^\* \[[^]]+\]:? /* /')

          gh release create "$TAG" --title "$TAG" --notes "$NOTES"
